<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>LeFiveyyy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   LEFIVEYYY - design system
   ============================================================ */
:root{
  --bg:#0a0f1a;
  --bg-soft:#0d1420;
  --surface:#131b2c;
  --surface-2:#182238;
  --surface-hover:#1e2b45;
  --border:#232f47;
  --border-soft:#1a2338;
  --text:#eef1f7;
  --text-dim:#93a0b8;
  --text-faint:#5c6b87;
  --primary:#22c55e;
  --primary-dark:#16a34a;
  --primary-glow:rgba(34,197,94,.18);
  --accent:#3b82f6;
  --accent-2:#8b5cf6;
  --gold:#fbbf24;
  --silver:#cbd5e1;
  --bronze:#e08a3f;
  --danger:#ef4444;
  --danger-dark:#b91c1c;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
             repeating-linear-gradient(100deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 70px, transparent 70px, transparent 140px),
             radial-gradient(1200px 800px at 10% -10%, #0f2138 0%, transparent 60%),
             radial-gradient(1100px 800px at 100% 0%, #0f2b1d 0%, transparent 55%),
             radial-gradient(900px 700px at 50% 110%, #0f2b1d 0%, transparent 60%),
             var(--bg);
  color:var(--text);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:76px;
  position:relative;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::selection{background:var(--primary-glow);}

/* ---------- Habillage terrain de foot (filigrane) ---------- */
.pitch-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:.5;}
.pitch-bg svg{position:absolute;top:50%;left:50%;width:1400px;height:1400px;max-width:none;transform:translate(-50%,-50%);opacity:.045;}
.pitch-ball{position:fixed;font-size:220px;line-height:1;opacity:.035;pointer-events:none;z-index:-1;filter:blur(.5px);}
.pitch-ball.b1{top:-40px;right:-60px;transform:rotate(12deg);}
.pitch-ball.b2{bottom:-80px;left:-70px;transform:rotate(-18deg);font-size:260px;}
@media(max-width:700px){.pitch-ball{font-size:140px;}.pitch-ball.b2{font-size:170px;}}

.hidden{display:none !important;}
.container{max-width:1180px;margin:0 auto;padding:0 18px;}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(10,15,26,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;font-size:17px;}
.brand .ball{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 4px 14px var(--primary-glow);
}
.nav-desktop{display:flex;gap:4px;}
.nav-desktop a{
  padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text-dim);
  display:flex;align-items:center;gap:7px;transition:.15s;
}
.nav-desktop a:hover{color:var(--text);background:var(--surface);}
.nav-desktop a.active{color:var(--primary);background:var(--primary-glow);}
.burger{
  display:none;width:40px;height:40px;border-radius:10px;background:var(--surface);
  border:1px solid var(--border);color:var(--text);align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;
}
.page-title-mobile{display:none;font-weight:800;font-size:16px;}

/* mobile sidebar */
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:.2s;}
.sidebar-backdrop.show{opacity:1;pointer-events:auto;}
.sidebar{
  position:fixed;top:0;bottom:0;right:-280px;width:270px;z-index:61;
  background:var(--surface);border-left:1px solid var(--border);
  transition:right .22s ease;padding:18px;display:flex;flex-direction:column;gap:6px;
}
.sidebar.show{right:0;}
.sidebar a{padding:12px 14px;border-radius:10px;font-weight:600;font-size:15px;color:var(--text-dim);display:flex;gap:10px;align-items:center;}
.sidebar a.active{color:var(--primary);background:var(--primary-glow);}
.sidebar-close{align-self:flex-end;background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;margin-bottom:6px;}

@media(max-width:860px){
  .nav-desktop{display:none;}
  .burger{display:flex;}
  .page-title-mobile{display:block;}
  .brand span.brand-text{display:none;}
}

/* ---------- View / page ---------- */
#view{max-width:1180px;margin:0 auto;padding:22px 18px 60px;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.page-header h1{font-size:22px;margin:0;display:flex;align-items:center;gap:10px;}
.page-sub{color:var(--text-dim);font-size:14px;margin-top:4px;}

.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;
  font-size:14px;cursor:pointer;transition:.15s;
}
.btn:hover{background:var(--surface-hover);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border:none;color:#04170b;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-danger{background:transparent;border:1px solid rgba(239,68,68,.4);color:var(--danger);}
.btn-danger:hover{background:rgba(239,68,68,.1);}
.btn-ghost{background:transparent;border:1px solid var(--border);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;justify-content:center;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:920px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{
  background:linear-gradient(180deg,var(--surface) 0%, var(--surface-2) 100%);
  border:1px solid var(--border);border-radius:var(--radius);padding:18px;
}
.stat-card{
  background:linear-gradient(155deg,var(--surface) 0%, var(--surface-2) 120%);
  border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  position:relative;overflow:hidden;
}
.stat-card .stat-icon{font-size:22px;opacity:.9;}
.stat-card .stat-val{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:-.5px;}
.stat-card .stat-label{font-size:12.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;margin-top:2px;}
.stat-card::after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:var(--primary-glow);filter:blur(10px);}

.five-card{
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;
  transition:.18s;display:flex;flex-direction:column;gap:10px;
}
.five-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow);}
.five-card .five-num{font-size:12.5px;font-weight:800;color:var(--primary);letter-spacing:.6px;}
.five-card .five-date{font-weight:700;font-size:15px;}
.five-card .five-meta{color:var(--text-dim);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;}
.five-score{
  display:flex;align-items:center;justify-content:center;gap:14px;font-size:30px;font-weight:800;
  padding:10px 0;letter-spacing:1px;
}
.five-score .vs{color:var(--text-faint);font-size:16px;font-weight:600;}
.five-card .five-footer{display:flex;justify-content:space-between;color:var(--text-dim);font-size:12.5px;border-top:1px solid var(--border-soft);padding-top:10px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);}
.badge-a{color:var(--accent);border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.1);}
.badge-b{color:var(--accent-2);border-color:rgba(139,92,246,.35);background:rgba(139,92,246,.1);}
.badge-gold{color:var(--gold);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1);}

/* player avatar */
.avatar{border-radius:50%;object-fit:cover;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--text-dim);overflow:hidden;flex-shrink:0;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar-placeholder{background:linear-gradient(160deg,var(--surface-2),var(--surface));color:var(--text-faint);}
.avatar-placeholder svg{width:56%;height:56%;}

/* player row / list */
.player-row{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:.15s;
}
.player-row:hover{background:var(--surface-hover);border-color:var(--primary);}
.player-row .pname{font-weight:700;font-size:14.5px;}
.player-row .psub{font-size:12px;color:var(--text-dim);}
.player-row .pstats{display:flex;gap:16px;margin-left:auto;text-align:center;}
.player-row .pstats div b{display:block;font-size:15px;}
.player-row .pstats div span{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;}

.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.input, select.input, textarea.input{
  background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;
  padding:10px 12px;font-size:14px;font-family:inherit;width:100%;
}
.input:focus, select.input:focus, textarea.input:focus{outline:none;border-color:var(--primary);}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.pill{padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;}
.pill.active{background:var(--primary-glow);border-color:var(--primary);color:var(--primary);}

/* tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border-soft);margin-bottom:18px;overflow-x:auto;}
.tab{padding:10px 16px;font-weight:700;font-size:13.5px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--primary);border-color:var(--primary);}

/* timeline */
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:20px;}
.tl-item::before{content:"⚽";position:absolute;left:-26px;top:0;width:20px;height:20px;font-size:13px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:2px solid var(--primary);border-radius:50%;}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.tl-score{font-weight:800;font-size:16px;min-width:56px;color:var(--primary);}
.tl-body{flex:1;min-width:150px;}
.tl-scorer{font-weight:700;font-size:14.5px;}
.tl-assist{font-size:12.5px;color:var(--text-dim);margin-top:2px;}

/* ---------- Fil de match : buts équipe A à gauche / équipe B à droite ---------- */
.match-feed{position:relative;}
.match-feed::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;background:var(--border);transform:translateX(-50%);}
.feed-row{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:10px;margin-bottom:14px;position:relative;}
.feed-side{min-width:0;display:flex;}
.feed-left{justify-content:flex-end;}
.feed-right{justify-content:flex-start;}
.feed-center{
  width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;z-index:1;
}
.feed-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;
  display:inline-flex;flex-direction:column;gap:4px;max-width:100%;min-width:150px;
}
.feed-card.team-a{border-right:3px solid var(--accent);align-items:flex-end;text-align:right;}
.feed-card.team-b{border-left:3px solid var(--accent-2);align-items:flex-start;text-align:left;}
.feed-card.team-none{border-left:3px solid var(--text-faint);align-items:flex-start;text-align:left;}
.feed-score-chip{font-size:11px;font-weight:800;color:var(--text-dim);background:var(--surface-2);border-radius:6px;padding:2px 7px;}
.feed-scorer{font-weight:700;font-size:14px;}
.feed-assist{font-size:12px;color:var(--text-dim);}
@media(max-width:700px){
  .match-feed::before{display:none;}
  .feed-row{display:block;margin-bottom:10px;}
  .feed-center{display:none;}
  .feed-side{display:block !important;justify-content:flex-start !important;}
  .feed-left:empty, .feed-right:empty{display:none !important;}
  .feed-card{width:100%;text-align:left !important;align-items:flex-start !important;}
  .feed-card.team-a{border-right:none;border-left:3px solid var(--accent);}
}

/* profile header */
.profile-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
.profile-head .avatar{width:132px;height:132px;font-size:44px;}
.profile-head h1{margin:0;font-size:26px;}

/* ---------- Stat strip compact (fiche joueur) ---------- */
.stat-strip{display:flex;flex-wrap:wrap;padding:4px 0;}
.stat-chip{flex:1;min-width:110px;text-align:center;padding:12px 10px;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;}
.stat-chip:not(:last-child)::after{content:"";position:absolute;right:0;top:18%;bottom:18%;width:1px;background:var(--border-soft);}
.stat-chip .sc-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--stat-glow,var(--primary-glow));color:var(--stat-color,var(--primary));margin-bottom:2px;}
.stat-chip .sc-val{font-size:19px;font-weight:800;line-height:1.1;}
.stat-chip .sc-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;}
@media(max-width:640px){.stat-chip{min-width:33%;}.stat-chip:nth-child(3n)::after{display:none;}}
.strip-title{font-size:12px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;padding:12px 14px 0;}
.profile-flagline{color:var(--text-dim);font-size:14px;margin-top:4px;display:flex;gap:8px;align-items:center;}

/* rankings */
.rank-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--border-soft);}
.rank-row:last-child{border-bottom:none;}
.rank-medal{width:30px;text-align:center;font-size:17px;font-weight:800;flex-shrink:0;}
.rank-medal.g{color:var(--gold);}
.rank-medal.s{color:var(--silver);}
.rank-medal.b{color:var(--bronze);}
.rank-val{margin-left:auto;font-weight:800;font-size:16px;color:var(--primary);}

/* duos */
.duo-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;}
.duo-row:hover{border-color:var(--accent);}
.duo-arrow{color:var(--text-faint);}
.duo-count{margin-left:auto;font-weight:800;color:var(--accent);}
.duo-row-combined{display:flex;flex-direction:column;align-items:stretch;gap:8px;}
.duo-combined-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.duo-combined-sub{display:flex;gap:18px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border-soft);font-size:12.5px;color:var(--text-dim);}
.duo-combined-sub b{color:var(--text);}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,7,14,.7);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:640px;padding:22px;box-shadow:var(--shadow);animation:pop .18s ease;}
@keyframes pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:none;}}
.modal h2{margin:0 0 16px;font-size:19px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.form-2col{grid-template-columns:1fr;}}
.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:180px;overflow-y:auto;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:10px;}
@media(max-width:480px){.check-grid{grid-template-columns:1fr;}}
.check-grid label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text);font-weight:500;text-transform:none;letter-spacing:0;margin:0;}
.goal-row{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;position:relative;}
.goal-row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.goal-row-head span{font-weight:800;font-size:12.5px;color:var(--text-dim);}
.modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
.hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;}

/* admin */
.admin-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:8px;}
.admin-item .info{flex:1;min-width:0;}
.admin-item .info b{font-size:14.5px;}
.admin-item .info div{font-size:12px;color:var(--text-dim);}
.admin-actions{display:flex;gap:6px;flex-shrink:0;}

/* video */
.video-modal video{width:100%;border-radius:12px;background:#000;max-height:70vh;}
.play-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:var(--primary);font-weight:700;font-size:12.5px;cursor:pointer;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty-state .e-icon{font-size:40px;margin-bottom:10px;}

.section-title{font-size:15px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;color:var(--text);}
.section-title small{font-weight:500;color:var(--text-faint);font-size:12px;}

.toast-wrap{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--surface-2);border:1px solid var(--border);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);animation:toastIn .2s ease;}
.toast.success{border-color:rgba(34,197,94,.5);color:var(--primary);}
.toast.error{border-color:rgba(239,68,68,.5);color:var(--danger);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.chart-wrap{overflow-x:auto;}
.notice{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.3);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--text-dim);margin-bottom:16px;}
.notice b{color:var(--accent);}

table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.data-table th{text-align:left;color:var(--text-dim);font-size:11.5px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border);}
table.data-table td{padding:9px 10px;border-bottom:1px solid var(--border-soft);}
table.data-table tr:hover td{background:var(--surface-hover);}

/* ---------- Visual polish v2 ---------- */

<script>
'use strict';
/* ============================================================
   LEFIVEYYY - application logique
   Architecture pensée pour migration future vers backend :
   - La couche "Repo" (repositories) est le SEUL point d'accès aux
     données. Aujourd'hui elle parle à IndexedDB. Demain, il suffira
     de remplacer le corps de ces fonctions par des appels fetch()
     vers une API REST, sans toucher au reste de l'application
     (calculs de stats, rendu, formulaires).
   ============================================================ */

/* ---------------- Utils ---------------- */
function uid(prefix){return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
function pad2(n){return String(n).padStart(2,'0');}
const MONTHS_FR=['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];
function fmtDateLong(iso){
  if(!iso) return '-';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return '-';
  return `${d.getDate()} ${MONTHS_FR[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDateShort(iso){
  if(!iso) return '-';
  const parts=iso.split('-');
  if(parts.length!==3) return iso;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}
function computeAge(birth){
  if(!birth) return null;
  const b=new Date(birth+'T00:00:00');
  if(isNaN(b)) return null;
  const now=new Date();
  let age=now.getFullYear()-b.getFullYear();
  const md=now.getMonth()-b.getMonth();
  if(md<0||(md===0&&now.getDate()<b.getDate())) age--;
  return age;
}
function flagEmoji(code){
  if(!code||code.length!==2) return '🏳️';
  const c=code.toUpperCase();
  const A=0x1F1E6;
  const c0=c.charCodeAt(0)-65, c1=c.charCodeAt(1)-65;
  if(c0<0||c0>25||c1<0||c1>25) return '🏳️';
  return String.fromCodePoint(A+c0)+String.fromCodePoint(A+c1);
}
function countryName(code){
  if(!code) return '';
  try{ return new Intl.DisplayNames(['fr'],{type:'region'}).of(code.toUpperCase()); }
  catch(e){ return code; }
}
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function playerName(p){ return p? p.name : 'Joueur supprimé'; }
function fmtNum(n,d){ if(n===null||n===undefined||isNaN(n)) return '-'; return d? n.toFixed(d):Math.round(n); }
function fmtPct(n){ return (n===null||n===undefined)? '-' : n+'%'; }
function debounce(fn,ms){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);}; }
function toast(msg,type){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>el.remove(),300); },2200);
}
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
function dataURLtoBlob(dataurl){
  const arr=dataurl.split(',');
  const mimeMatch=arr[0].match(/:(.*?);/);
  const mime=mimeMatch?mimeMatch[1]:'application/octet-stream';
  const bstr=atob(arr[1]);
  let n=bstr.length;
  const u8=new Uint8Array(n);
  while(n--){ u8[n]=bstr.charCodeAt(n); }
  return new Blob([u8],{type:mime});
}
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(blob);
  });
}

/* ============================================================
   COUCHE DE PERSISTANCE - Supabase (base partagée en ligne)
   ============================================================ */
const SUPABASE_URL='https://pjzpezjponuqdogxusct.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_TbCMf0PqZHDJ_b_l-YIOmA_PkR5hST2';
const VIDEO_BUCKET='goal-videos';
const sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function sbCheck(res){
  if(res && res.error) throw res.error;
  return res? res.data : null;
}

/* ---- mapping camelCase (app) <-> snake_case (Postgres) ---- */
function playerFromDb(r){ return { id:r.id, name:r.name, photo:r.photo||null, notes:r.notes||'', createdAt:r.created_at? new Date(r.created_at).getTime():Date.now() }; }
function playerToDb(p){ return { id:p.id, name:p.name, photo:p.photo||null, notes:p.notes||'' }; }

function fiveFromDb(r){ return { id:r.id, date:r.date, timeStart:r.time_start||'', timeEnd:r.time_end||'', location:r.location||'', notes:r.notes||'', createdAt:r.created_at? new Date(r.created_at).getTime():Date.now() }; }
function fiveToDb(f){ return { id:f.id, date:f.date, time_start:f.timeStart||null, time_end:f.timeEnd||null, location:f.location||null, notes:f.notes||'' }; }

function participationFromDb(r){ return { id:r.id, fiveId:r.five_id, playerId:r.player_id, teamId:r.team_id||null }; }
function participationToDb(p){ return { id:p.id, five_id:p.fiveId, player_id:p.playerId, team_id:p.teamId||null }; }

function goalFromDb(r){ return { id:r.id, fiveId:r.five_id, order:r.goal_order, scorerId:r.scorer_id, assisterId:r.assister_id||null, isOwnGoal:!!r.is_own_goal, videoUrl:r.video_url||null, videoFilename:r.video_filename||null, videoPath:r.video_path||null, videoSize:r.video_size||0, createdAt:r.created_at? new Date(r.created_at).getTime():Date.now() }; }
function goalToDb(g){ return { id:g.id, five_id:g.fiveId, goal_order:g.order, scorer_id:g.scorerId, assister_id:g.isOwnGoal? null : (g.assisterId||null), is_own_goal:!!g.isOwnGoal, video_url:g.videoUrl||null, video_filename:g.videoFilename||null, video_path:g.videoPath||null, video_size:g.videoSize||0 }; }

/* ---------------- Repositories ----------------
   Point d'accès unique aux données. Ici elles parlent à Supabase. */
const PlayersRepo={
  all: async ()=>{ const {data,error}=await sb.from('players').select('*'); if(error) throw error; return data.map(playerFromDb); },
  save: async (p)=>{ const {error}=await sb.from('players').upsert(playerToDb(p)); if(error) throw error; return p; },
  remove: async (id)=>{ const {error}=await sb.from('players').delete().eq('id',id); if(error) throw error; }
};
const FivesRepo={
  all: async ()=>{ const {data,error}=await sb.from('fives').select('*'); if(error) throw error; return data.map(fiveFromDb); },
  save: async (f)=>{ const {error}=await sb.from('fives').upsert(fiveToDb(f)); if(error) throw error; return f; },
  remove: async (id)=>{ const {error}=await sb.from('fives').delete().eq('id',id); if(error) throw error; }
};
const ParticipationsRepo={
  all: async ()=>{ const {data,error}=await sb.from('participations').select('*'); if(error) throw error; return data.map(participationFromDb); },
  save: async (p)=>{ const {error}=await sb.from('participations').upsert(participationToDb(p)); if(error) throw error; return p; },
  remove: async (id)=>{ const {error}=await sb.from('participations').delete().eq('id',id); if(error) throw error; }
};
const GoalsRepo={

/* Upload/suppression de fichiers vidéo dans Supabase Storage.
   Les métadonnées (url, chemin, nom, taille) sont stockées directement
   sur la ligne du but concerné (colonnes video_* de la table goals). */
const VideosRepo={
  upload: async (goalId,file)=>{
    const ext=(file.name.split('.').pop()||'mp4').toLowerCase();
    const path=`${goalId}-${Date.now()}.${ext}`;
    const {error}=await sb.storage.from(VIDEO_BUCKET).upload(path,file,{upsert:true, contentType:file.type||'video/mp4'});

    const {data}=sb.storage.from(VIDEO_BUCKET).getPublicUrl(path);
    return { url:data.publicUrl, path, fileName:file.name, size:file.size };
  },
  remove: async (path)=>{
    if(!path) return;
    const {error}=await sb.storage.from(VIDEO_BUCKET).remove([path]);

  }
};

function getPlayer(id){ return STATE.players.find(p=>p.id===id) || null; }

/* ============================================================
/* ============================================================
   MOTEUR DE STATISTIQUES - fonctions pures sur STATE
   (aucune statistique n'est stockée : tout est recalculé depuis
   les entités brutes Player / Five / Participation / Goal)
   ============================================================ */
function fivesSorted(){
  return [...STATE.fives].sort((a,b)=> (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
}
function fiveNumber(fiveId){
  const list=fivesSorted();
  const idx=list.findIndex(f=>f.id===fiveId);
  return idx===-1? null : idx+1;
}
function goalsForFive(fiveId){
  return STATE.goals.filter(g=>g.fiveId===fiveId).sort((a,b)=>a.order-b.order);
}
function participationsForFive(fiveId){
  return STATE.participations.filter(p=>p.fiveId===fiveId);
}
function teamOfPlayerInFive(fiveId,playerId){
  const p=STATE.participations.find(x=>x.fiveId===fiveId && x.playerId===playerId);
  return p? p.teamId : null;
}
function fiveGoalsWithScore(fiveId){
  let a=0,b=0;
  const goals=goalsForFive(fiveId);
  return goals.map(g=>{
    const before={a,b};
    const scorerTeam=teamOfPlayerInFive(fiveId,g.scorerId);
    // un CSC compte pour l'équipe adverse du buteur
    const team = g.isOwnGoal ? (scorerTeam==='A'?'B':scorerTeam==='B'?'A':null) : scorerTeam;
    if(team==='A') a++; else if(team==='B') b++;
    const after={a,b};
    return Object.assign({},g,{before,after,team});
  });
}
function fiveScore(fiveId){
  const list=fiveGoalsWithScore(fiveId);
  if(!list.length) return {a:0,b:0};
  return list[list.length-1].after;
}
function playersInFive(fiveId){
  return participationsForFive(fiveId).map(p=>Object.assign({},p,{player:getPlayer(p.playerId)}));
}
function playerFiveIds(playerId){
  return STATE.participations.filter(p=>p.playerId===playerId).map(p=>p.fiveId);
}
function playerStatsForFive(playerId,fiveId){
  const goals=goalsForFive(fiveId);
  const g=goals.filter(x=>x.scorerId===playerId && !x.isOwnGoal).length;
  const og=goals.filter(x=>x.scorerId===playerId && x.isOwnGoal).length;
  const as=goals.filter(x=>x.assisterId===playerId && !x.isOwnGoal).length;
  return {goals:g,assists:as,ga:g+as,ownGoals:og};
}
function playerResultInFive(playerId,fiveId){
  const team=teamOfPlayerInFive(fiveId,playerId);
  if(!team) return null;
  const score=fiveScore(fiveId);
  if(score.a===score.b) return 'draw';
  if((team==='A'&&score.a>score.b) || (team==='B'&&score.b>score.a)) return 'win';
  return 'loss';
}
function playerFullStats(playerId){
  const fiveIds=[...new Set(playerFiveIds(playerId))];
  const list=fiveIds.map(id=>getFive(id)).filter(Boolean).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0));
  let goals=0, assists=0, wins=0, draws=0, losses=0, withResult=0, goalsWithAssist=0, goalsNoAssist=0, ownGoals=0;
  const perFive=[];
  for(const five of list){
    const s=playerStatsForFive(playerId,five.id);
    goals+=s.goals; assists+=s.assists; ownGoals+=s.ownGoals;
    const result=playerResultInFive(playerId,five.id);
    if(result){ withResult++; if(result==='win') wins++; else if(result==='draw') draws++; else losses++; }
    const goalsOfPlayer=goalsForFive(five.id).filter(g=>g.scorerId===playerId && !g.isOwnGoal);
    goalsOfPlayer.forEach(g=>{ if(g.assisterId) goalsWithAssist++; else goalsNoAssist++; });
    perFive.push({five,goals:s.goals,assists:s.assists,ga:s.goals+s.assists,ownGoals:s.ownGoals,result});
  }
  const matches=list.length;
  const ga=goals+assists;
  const winPct=withResult? Math.round(wins/withResult*100):null;
  const noLossPct=withResult? Math.round((wins+draws)/withResult*100):null;
  let curG=0,bestG=0,curGA=0,bestGA=0;
  for(const pf of perFive){
    if(pf.goals>0) curG++; else curG=0;
    bestG=Math.max(bestG,curG);
    if(pf.ga>0) curGA++; else curGA=0;
    bestGA=Math.max(bestGA,curGA);
  }
  const last5=perFive.slice(-5), last10=perFive.slice(-10);
  const sum=(arr,k)=>arr.reduce((s,x)=>s+x[k],0);
  const bestFiveGoals=perFive.reduce((m,x)=>Math.max(m,x.goals),0);
  const bestFiveAssists=perFive.reduce((m,x)=>Math.max(m,x.assists),0);
  const bestFiveGA=perFive.reduce((m,x)=>Math.max(m,x.ga),0);
  const bestFiveGoalsFive=perFive.find(x=>x.goals===bestFiveGoals && bestFiveGoals>0)?.five || null;
  const bestFiveAssistsFive=perFive.find(x=>x.assists===bestFiveAssists && bestFiveAssists>0)?.five || null;
  const bestFiveGAFive=perFive.find(x=>x.ga===bestFiveGA && bestFiveGA>0)?.five || null;
  const totalFivesCount=STATE.fives.length;
  const participationRate=totalFivesCount? Math.round(matches/totalFivesCount*100):null;
  return {
    matches,goals,assists,ga,wins,draws,losses,withResult,winPct,noLossPct,ownGoals,
    avgGoals:matches?goals/matches:0, avgAssists:matches?assists/matches:0, avgGA:matches?ga/matches:0,
    last5Goals:sum(last5,'goals'), last5Assists:sum(last5,'assists'), last5GA:sum(last5,'ga'),
    last10Goals:sum(last10,'goals'), last10Assists:sum(last10,'assists'), last10GA:sum(last10,'ga'),
    goalsWithAssist, goalsNoAssist,
    bestGoalStreak:bestG, bestGAStreak:bestGA,
    bestFiveGoals, bestFiveAssists, bestFiveGA,
    bestFiveGoalsFive, bestFiveAssistsFive, bestFiveGAFive,
    participationRate, perFive
  };
}
function statFromFilter(playerId,statKey,filter){
  const fs=playerFullStats(playerId);
  if(filter==='total') return fs[statKey];
  if(filter==='avg'){
    if(statKey==='goals') return fs.avgGoals;
    if(statKey==='assists') return fs.avgAssists;
    if(statKey==='wins') return fs.winPct||0;
    return fs.avgGA;
  }
  if(filter==='last5'){
    if(statKey==='goals') return fs.last5Goals;
    if(statKey==='assists') return fs.last5Assists;
    return fs.last5GA;
  }
  if(filter==='last10'){
    if(statKey==='goals') return fs.last10Goals;
    if(statKey==='assists') return fs.last10Assists;
    return fs.last10GA;
  }
  if(filter && filter.startsWith('season:')){
    const year=filter.split(':')[1];
    const filtered=fs.perFive.filter(pf=>pf.five.date && pf.five.date.startsWith(year));
    const g=filtered.reduce((s,x)=>s+x.goals,0);
    const a=filtered.reduce((s,x)=>s+x.assists,0);
    if(statKey==='goals') return g;
    if(statKey==='assists') return a;
    return g+a;
  }
  return fs[statKey];
}
function availableSeasons(){
  const years=new Set();
  STATE.fives.forEach(f=>{ if(f.date) years.add(f.date.slice(0,4)); });
  return [...years].sort().reverse();
}
function rankPlayers(statKey,filter){
  const playedPlayers=STATE.players.filter(p=>playerFiveIds(p.id).length>0);
  const rows=playedPlayers.map(p=>({player:p, value:statFromFilter(p.id,statKey,filter)||0}));
  rows.sort((a,b)=>b.value-a.value);
  let rank=0, prev=null;
  return rows.map((r,i)=>{ if(r.value!==prev){ rank=i+1; prev=r.value; } return Object.assign({},r,{rank}); });
}
function duosData(){
  const directional={};
  for(const g of STATE.goals){
    if(g.assisterId){
      const key=g.assisterId+'|'+g.scorerId;
      directional[key]=(directional[key]||0)+1;
    }
  }
  const pairs={};
  for(const key in directional){
    const [assisterId,scorerId]=key.split('|');
    if(assisterId===scorerId) continue;
    const sorted=[assisterId,scorerId].sort();
    const pairKey=sorted[0]+'|'+sorted[1];
    if(!pairs[pairKey]) pairs[pairKey]={playerA:sorted[0], playerB:sorted[1], aToB:0, bToA:0};
    if(assisterId===sorted[0]) pairs[pairKey].aToB=directional[key];
    else pairs[pairKey].bToA=directional[key];
  }
  const list=Object.values(pairs).map(p=>Object.assign({},p,{total:p.aToB+p.bToA}));
  list.sort((a,b)=>b.total-a.total);
  return list;
}
function assistsBreakdownForScorer(playerId){
  const goals=STATE.goals.filter(g=>g.scorerId===playerId);
  const map={};
  let none=0;
  for(const g of goals){
    if(g.assisterId) map[g.assisterId]=(map[g.assisterId]||0)+1;
    else none++;
  }
  return {map, none, total:goals.length};
}
/* Face-à-face : pour chaque adversaire déjà affronté (équipes opposées
   dans un même Five, résultat connu), le bilan V/N/D de playerId. */
function headToHeadStats(playerId){
  const myParts=STATE.participations.filter(p=>p.playerId===playerId && p.teamId);
  const opponents={};
  for(const myPart of myParts){
    const result=playerResultInFive(playerId, myPart.fiveId);
    if(!result) continue;
    const oppParts=STATE.participations.filter(p=>p.fiveId===myPart.fiveId && p.teamId && p.teamId!==myPart.teamId && p.playerId!==playerId);
    for(const opp of oppParts){
      if(!opponents[opp.playerId]) opponents[opp.playerId]={wins:0,draws:0,losses:0,matches:0};
      const o=opponents[opp.playerId];
      o.matches++;
      if(result==='win') o.wins++; else if(result==='draw') o.draws++; else o.losses++;
    }
  }
  return Object.entries(opponents).map(([opponentId,s])=>Object.assign({opponentId, winPct:Math.round(s.wins/s.matches*100)}, s));
}
function nemesisAndFavoriteTarget(playerId){
  const h2h=headToHeadStats(playerId);
  if(!h2h.length) return {nemesis:[], favoriteTarget:[]};
  const minPct=Math.min(...h2h.map(x=>x.winPct));
  const maxPct=Math.max(...h2h.map(x=>x.winPct));
  return {
    nemesis: h2h.filter(x=>x.winPct===minPct),
    favoriteTarget: h2h.filter(x=>x.winPct===maxPct)
  };
}
function computeRecords(){
  const played=STATE.players.filter(p=>playerFiveIds(p.id).length>0);
  const fullStats=played.map(p=>({player:p, fs:playerFullStats(p.id)}));

  // topBy : renvoie {value, holders:[{player}]} en gérant les égalités
  function topBy(fn){
    if(!fullStats.length) return null;
    let maxV=-Infinity;
    fullStats.forEach(({fs})=>{ const v=fn(fs); if(v>maxV) maxV=v; });
    if(maxV<=0) return null;
    const holders=fullStats.filter(({fs})=>fn(fs)===maxV).map(({player})=>({player}));
    return {value:maxV, holders};
  }
  // topByFive : renvoie {value, holders:[{player,five}]} - un joueur n'apparaît
  // qu'une fois (avec le premier Five où il a atteint ce record), même s'il l'a
  // égalé plusieurs fois lui-même.
  function topByFive(metric){
    let maxV=-Infinity;
    fullStats.forEach(({fs})=>{ fs.perFive.forEach(pf=>{ const v=metric(pf); if(v>maxV) maxV=v; }); });
    if(maxV<=0) return null;
    const seen=new Set();
    const holders=[];
    fullStats.forEach(({player,fs})=>{
      fs.perFive.forEach(pf=>{
        if(metric(pf)===maxV && !seen.has(player.id)){
          seen.add(player.id);
          holders.push({player,five:pf.five});
        }
      });
    });
    return {value:maxV, holders};
  }
  return {
    mostGoalsInFive: topByFive(pf=>pf.goals),
    mostAssistsInFive: topByFive(pf=>pf.assists),
    mostGAInFive: topByFive(pf=>pf.ga),
    mostFivesPlayed: topBy(fs=>fs.matches),
    mostTotalGoals: topBy(fs=>fs.goals),
    mostTotalAssists: topBy(fs=>fs.assists),
    mostTotalGA: topBy(fs=>fs.ga),
    longestGoalStreak: topBy(fs=>fs.bestGoalStreak),
    longestGAStreak: topBy(fs=>fs.bestGAStreak)
  };
}
function dashboardStats(){
  const totalFives=STATE.fives.length;
  const totalPlayers=STATE.players.length;
  const totalGoals=STATE.goals.length;
  const totalAssists=STATE.goals.filter(g=>g.assisterId).length;
  const sorted=fivesSorted();
  const lastFive=sorted.length? sorted[sorted.length-1] : null;
  const today=new Date().toISOString().slice(0,10);
  const nextFive=sorted.filter(f=>f.date && f.date>today).sort((a,b)=>a.date.localeCompare(b.date))[0] || null;
  const topScorerRanked=rankPlayers('goals','total');
  const topAssisterRanked=rankPlayers('assists','total');
  const topGARanked=rankPlayers('ga','total');
  const topScorer=(topScorerRanked.length && topScorerRanked[0].value>0)? topScorerRanked.filter(r=>r.rank===1) : [];
  const topAssister=(topAssisterRanked.length && topAssisterRanked[0].value>0)? topAssisterRanked.filter(r=>r.rank===1) : [];
  const topGA=(topGARanked.length && topGARanked[0].value>0)? topGARanked.filter(r=>r.rank===1) : [];
  let bestFive=null;
  STATE.fives.forEach(f=>{ const n=goalsForFive(f.id).length; if(!bestFive||n>bestFive.count) bestFive={five:f,count:n}; });
  return {totalFives,totalPlayers,totalGoals,totalAssists,lastFive,nextFive,topScorer,topAssister,topGA,bestFive};
}

function avatarHTML(player,size,ringClass){
  size=size||40;

function barChart(data,color){
  if(!data.length) return '';
  const max=Math.max(...data.map(d=>d.value),1);
  const w=Math.max(320,data.length*70), h=180, barW=40, gap=(w-data.length*barW)/(data.length+1);
  let bars='';
  data.forEach((d,i)=>{
    const bh=Math.round((d.value/max)*120);
    const x=gap+i*(barW+gap);
    const y=150-bh;
    bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="6" fill="${color}" opacity="0.9"/>
           <text x="${x+barW/2}" y="${y-8}" text-anchor="middle" fill="#e5e9f0" font-size="13" font-weight="700">${d.value}</text>
           <text x="${x+barW/2}" y="168" text-anchor="middle" fill="#93a0b8" font-size="11">${esc(d.label.slice(0,8))}</text>`;
  });
  return `<svg viewBox="0 0 ${w} 180" width="100%" height="180" style="min-width:${w}px;">${bars}</svg>`;
}

function compareBar(label,valA,valB,decimals,suffix){
  const max=Math.max(Math.abs(valA),Math.abs(valB),0.0001);
  const pctA=Math.max(4,Math.round(Math.abs(valA)/max*100));
  const pctB=Math.max(4,Math.round(Math.abs(valB)/max*100));
  const winA = valA>valB, winB = valB>valA;
  return `
  <div class="cmp-row">
    <div class="cmp-val ${winA?'cmp-win':''}">${fmtNum(valA,decimals)}${suffix||''}</div>
    <div class="cmp-mid">
      <div class="cmp-label">${label}</div>

}

function factorial(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
function poissonProbAtLeast(lambda,k){
  if(lambda<=0) return k===0?1:0;
  let cum=0;
  for(let i=0;i<k;i++) cum += Math.pow(lambda,i)*Math.exp(-lambda)/factorial(i);
  return Math.max(0,Math.min(1,1-cum));
}
function probToOdds(prob,margin){
  margin=margin||1.15;
  const clamped=Math.max(0.02,Math.min(0.97,prob));
  let odds=1/(clamped*margin);
  odds *= (0.92+Math.random()*0.16); // petit aléa pour que les cotes "bougent" à chaque actualisation
  return Math.max(1.03,Math.min(50,Math.round(odds*100)/100));
}
function generateBettingBoard(){
  const players=STATE.players.filter(p=>playerFiveIds(p.id).length>0).map(p=>({p,fs:playerFullStats(p.id)})).filter(x=>x.fs.matches>0);
  const bets=[];

  // top 2 buteurs en forme -> pari "marque un but"
  const byGoals=[...players].sort((a,b)=>b.fs.avgGoals-a.fs.avgGoals).slice(0,2);
  byGoals.forEach(({p,fs})=>{
    bets.push({id:'goal_'+p.id, icon:'⚽', label:`${p.name} marque un but`, odds:probToOdds(poissonProbAtLeast(fs.avgGoals,1)), player:p});
  });

  // top 2 passeurs en forme -> pari "delivre une passe"
  const byAssists=[...players].sort((a,b)=>b.fs.avgAssists-a.fs.avgAssists).slice(0,2);
  byAssists.forEach(({p,fs})=>{
    bets.push({id:'assist_'+p.id, icon:'🎯', label:`${p.name} délivre une passe décisive`, odds:probToOdds(poissonProbAtLeast(fs.avgAssists,1)), player:p});
  });

  // le plus prolifique -> pari "doublé"
  if(byGoals.length){
    const {p,fs}=byGoals[0];
    const pBrace=poissonProbAtLeast(fs.avgGoals,2);
    if(pBrace>0.04) bets.push({id:'brace_'+p.id, icon:'🎩', label:`${p.name} marque un doublé (2 buts ou +)`, odds:probToOdds(pBrace,1.2), player:p});
  }

  // le moins en forme -> pari (un peu taquin) "ne marque ni ne passe"
  const byLowGA=[...players].sort((a,b)=>(a.fs.avgGoals+a.fs.avgAssists)-(b.fs.avgGoals+b.fs.avgAssists));
  if(byLowGA.length){
    const {p,fs}=byLowGA[0];
    bets.push({id:'blank_'+p.id, icon:'🚫', label:`${p.name} ne marque ni ne passe`, odds:probToOdds(Math.exp(-(fs.avgGoals+fs.avgAssists))), player:p});
  }

  // paris généraux
  const totalFives=STATE.fives.length;
  const totalOwnGoals=STATE.goals.filter(g=>g.isOwnGoal).length;
  const cscRate=totalFives? Math.max(0.05,totalOwnGoals/totalFives) : 0.08;
  bets.push({id:'csc', icon:'🥅', label:'Il y a au moins un CSC dans le prochain Five', odds:probToOdds(cscRate,1.1)});
  const totalRealGoals=STATE.goals.filter(g=>!g.isOwnGoal).length;
  const avgGoalsPerFive=totalFives? totalRealGoals/totalFives : 8;
  bets.push({id:'over', icon:'🔥', label:`Plus de ${Math.round(avgGoalsPerFive)} buts au total dans le prochain Five`, odds:probToOdds(0.5,1.1)});
  bets.push({id:'draw', icon:'➖', label:'Le prochain Five se termine sur un match nul', odds:probToOdds(0.18,1.1)});

  return bets;
}
let bettingBoardCache=null;
function getBettingBoard(){ if(!bettingBoardCache) bettingBoardCache=generateBettingBoard(); return bettingBoardCache; }

function toggleBet(betId){
  const board=getBettingBoard();

  const idx=bettingSlip.findIndex(b=>b.id===betId);
  if(idx>=0) bettingSlip.splice(idx,1);

  render();

async function submitPlayerForm(ev,playerId){
  ev.preventDefault();
  const fd=new FormData(ev.target);
  const name=(fd.get('name')||'').trim();
  if(!name){ toast('Le nom est obligatoire','error'); return false; }
  const existing=playerId? getPlayer(playerId) : null;
  const p={
    id: playerId || uid('pl'),
    name,
    birthDate: existing? existing.birthDate : null,
    country: existing? existing.country : null,
    notes: (fd.get('notes')||'').trim(),
    photo: existing? existing.photo : null,
    createdAt: existing? existing.createdAt : Date.now()
  };
  if(fd.get('removePhoto')) p.photo=null;
  const file=fd.get('photoFile');
  if(file && file.size>0){
    try{ p.photo=await fileToDataURL(file); }catch(e){ console.error(e); }
  }
  await PlayersRepo.save(p);
  await loadAll();
  closeModal();
  toast(existing? 'Joueur mis à jour':'Joueur ajouté','success');

async function deletePlayer(playerId){
  if(!isAdmin()){ toast('Connecte-toi pour modifier les données','error'); return; }
  const p=getPlayer(playerId);
  if(!p) return;
  const nb=playerFiveIds(playerId).length;
  const msg = nb>0
    ? `Supprimer "${p.name}" ? Il participe à ${nb} Five. Ses buts/passes resteront affichés comme "Joueur supprimé" dans l'historique des matchs.`
    : `Supprimer "${p.name}" ?`;
  if(!confirm(msg)) return;
  await PlayersRepo.remove(playerId);
  // on retire aussi ses participations (mais on garde les buts pour ne pas casser l'historique du match)
  const parts=STATE.participations.filter(x=>x.playerId===playerId);
  for(const part of parts) await ParticipationsRepo.remove(part.id);
  await loadAll();
  toast('Joueur supprimé','success');
  navigate('players');
}

}

/* Compression vidéo côté navigateur, sans dépendance externe :
   on redessine la vidéo dans un <canvas> et on la ré-encode avec
   MediaRecorder à un débit réduit (fonctionne sur Chrome/Firefox/Edge
   récents ; se dégrade proprement si l'API n'est pas disponible). */
function compressVideo(file, opts){
  opts=opts||{};
  const maxWidth=opts.maxWidth||1280;
  const bitrate=opts.bitrate||1500000;
  return new Promise((resolve,reject)=>{
    if(typeof MediaRecorder==='undefined'){ reject(new Error("La compression vidéo n'est pas supportée par ce navigateur.")); return; }
    const video=document.createElement('video');
    video.muted=false;
    video.playsInline=true;
    video.src=URL.createObjectURL(file);
    video.onloadedmetadata=()=>{
      const scale=Math.min(1, maxWidth/(video.videoWidth||maxWidth));
      const w=Math.max(2,Math.round((video.videoWidth||maxWidth)*scale));
      const h=Math.max(2,Math.round((video.videoHeight||720)*scale));
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      video.play().then(()=>{
        let stream;
        try{ stream=canvas.captureStream(30); }catch(e){ reject(e); return; }
        try{
          const srcStream = video.captureStream? video.captureStream() : (video.mozCaptureStream? video.mozCaptureStream() : null);
          if(srcStream){ srcStream.getAudioTracks().forEach(t=>stream.addTrack(t)); }
        }catch(e){ /* pas grave si l'audio ne peut pas être capturé */ }
        let mime='video/webm;codecs=vp9,opus';
        if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm;codecs=vp8,opus';
        if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
        let recorder;
        try{ recorder=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:bitrate}); }
        catch(e){ reject(e); return; }
        const chunks=[];
        recorder.ondataavailable=(e)=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
        recorder.onstop=()=>{
          URL.revokeObjectURL(video.src);
          if(!chunks.length){ reject(new Error('Échec de la compression (aucune donnée produite).')); return; }
          resolve(new Blob(chunks,{type:mime}));
        };
        recorder.onerror=(e)=>reject(e.error||new Error('Erreur MediaRecorder'));
        let stopped=false;
        function stopOnce(){ if(stopped) return; stopped=true; try{ recorder.stop(); }catch(e){} }
        function drawFrame(){
          if(video.paused||video.ended){ stopOnce(); return; }
          ctx.drawImage(video,0,0,w,h);
          requestAnimationFrame(drawFrame);
        }
        recorder.start(250);
        drawFrame();
        video.onended=stopOnce;
        // filet de sécurité : ne pas dépasser la durée réelle de la vidéo + marge
        setTimeout(stopOnce, ((video.duration||30)*1000)+2000);
      }).catch(reject);
    };
    video.onerror=()=>reject(new Error('Impossible de lire ce fichier vidéo.'));
  });
}
async function compressGoalVideo(rowId){
  const row=_fiveFormGoalRows.find(r=>r.rowId===rowId);
  if(!row || !row.videoFile) return;
  const originalFile=row.videoFile;
  toast('Compression en cours... (peut prendre quelques secondes)','');
  try{
    const blob=await compressVideo(originalFile,{maxWidth:1280,bitrate:1500000});
    const newName=originalFile.name.replace(/\.[^.]+$/,'')+'-compresse.webm';
    const compressedFile=new File([blob], newName, {type: blob.type||'video/webm'});
    if(compressedFile.size>=originalFile.size){
      toast('La compression n\'a pas réduit la taille du fichier, original conservé','error');
      return;
    }
    row.videoFile=compressedFile;
    syncGoalSelects();
    toast(`Vidéo compressée : ${fmtFileSize(originalFile.size)} → ${fmtFileSize(compressedFile.size)}`,'success');
  }catch(err){
    console.error(err);
    toast('Compression impossible sur ce navigateur : '+err.message,'error');
  }
}
async function submitFiveForm(ev,fiveId){
  ev.preventDefault();
  const fd=new FormData(ev.target);
  const date=fd.get('date');
  if(!date){ toast('La date est obligatoire','error'); return false; }
  const teamA=[...document.querySelectorAll('#teamACheck input:checked')].map(i=>i.value);
  const teamB=[...document.querySelectorAll('#teamBCheck input:checked')].map(i=>i.value);
  const overlap=teamA.filter(id=>teamB.includes(id));
  if(overlap.length){ toast('Un joueur ne peut pas être dans les deux équipes','error'); return false; }
  for(const row of _fiveFormGoalRows){
    if(!row.scorerId){ toast('Chaque but doit avoir un buteur','error'); return false; }
  }

  const existing=fiveId? getFive(fiveId) : null;
  const five={
    id: fiveId || uid('five'),
    date,
    timeStart: fd.get('timeStart')||'',
    timeEnd: fd.get('timeEnd')||'',
    location: (fd.get('location')||'').trim(),
    notes:'',
    createdAt: existing? existing.createdAt : Date.now()
  };
  await FivesRepo.save(five);

  // Participations : on remplace entièrement
  const oldParts=participationsForFive(five.id);
  for(const op of oldParts) await ParticipationsRepo.remove(op.id);
  for(const pid of teamA) await ParticipationsRepo.save({id:uid('part'),fiveId:five.id,playerId:pid,teamId:'A'});
  for(const pid of teamB) await ParticipationsRepo.save({id:uid('part'),fiveId:five.id,playerId:pid,teamId:'B'});

  // Buts : diff entre existants et formulaire
  const existingGoalsMap={};
  goalsForFive(five.id).forEach(g=>{ existingGoalsMap[g.id]=g; });
  const existingGoalIds=Object.keys(existingGoalsMap);
  const keptIds=[];
  let order=0;
  const submitBtn=document.querySelector('#fiveForm button[type="submit"]');
  for(const row of _fiveFormGoalRows){
    order++;
    const goalId=row.goalId || uid('goal');
    keptIds.push(goalId);
    const prev=row.goalId? existingGoalsMap[row.goalId] : null;
    let videoUrl=prev? prev.videoUrl : null;
    let videoFilename=prev? prev.videoFilename : null;
    let videoPath=prev? prev.videoPath : null;
    let videoSize=prev? prev.videoSize : 0;

    if(row.removeVideo && videoPath){
      await VideosRepo.remove(videoPath);
      videoUrl=null; videoFilename=null; videoPath=null; videoSize=0;
    }
    if(row.videoFile){
      if(videoPath) await VideosRepo.remove(videoPath);
      try{
        if(submitBtn){ submitBtn.disabled=true; submitBtn.textContent='Envoi de la vidéo...'; }
        const uploaded=await VideosRepo.upload(goalId, row.videoFile);
        videoUrl=uploaded.url; videoFilename=uploaded.fileName; videoPath=uploaded.path; videoSize=uploaded.size;
      }catch(e){
        console.error(e);
        toast('Impossible d\'envoyer la vidéo (fichier trop volumineux ou hors ligne ?)','error');
      }
    }
    await GoalsRepo.save({id:goalId, fiveId:five.id, order, scorerId:row.scorerId, assisterId:row.isOwnGoal? null : (row.assisterId||null), isOwnGoal:!!row.isOwnGoal, videoUrl, videoFilename, videoPath, videoSize, createdAt:Date.now()});
  }
  for(const gid of existingGoalIds){
    if(!keptIds.includes(gid)){
      const g=existingGoalsMap[gid];
      if(g && g.videoPath) await VideosRepo.remove(g.videoPath);
      await GoalsRepo.remove(gid);
    }
  }

  await loadAll();
  closeModal();
  toast(existing? 'Five mis à jour':'Five créé','success');
  navigate('five/'+five.id);
  return false;
}
async function deleteFive(fiveId){
  if(!isAdmin()){ toast('Connecte-toi pour modifier les données','error'); return; }
  const f=getFive(fiveId);
  if(!f) return;
  if(!confirm(`Supprimer le Five du ${fmtDateShort(f.date)} ? Cette action supprimera aussi tous ses buts et vidéos associées. Cette action est irréversible.`)) return;
  const goals=goalsForFive(fiveId);
  for(const g of goals){
    if(g.videoPath) await VideosRepo.remove(g.videoPath);
    await GoalsRepo.remove(g.id);
  }
  const parts=participationsForFive(fiveId);
  for(const p of parts) await ParticipationsRepo.remove(p.id);
  await FivesRepo.remove(fiveId);
  await loadAll();
  toast('Five supprimé','success');
  navigate('five');
}

/* ---------- Video player ---------- */
function playVideo(goalId){
  const meta=videoForGoal(goalId);
  if(!meta || !meta.url){ toast('Vidéo introuvable','error'); return; }
  openModal(`
    <div class="video-modal">
      <h2>▶️ ${esc(meta.fileName)}<button class="modal-close" onclick="closeModal()">✕</button></h2>
      <video src="${meta.url}" controls autoplay playsinline></video>
      <div class="modal-actions">
        <a class="btn btn-ghost" href="${meta.url}" target="_blank" rel="noopener">⬇️ Ouvrir / télécharger</a>
        <button class="btn btn-primary" onclick="closeModal()">Fermer</button>
      </div>
    </div>
  `);
}

/* ---------- Export / Import ---------- */
async function exportData(){
  toast('Préparation de l\'export...','');
  const payload={
    version:2,
    exportedAt:new Date().toISOString(),
    players:STATE.players,
    fives:STATE.fives,
    participations:STATE.participations,
    goals:STATE.goals
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`lefiveyyy-export-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('Export terminé (les vidéos restent hébergées sur Supabase, seuls les liens sont exportés)','success');
}
async function deleteAllRows(table){
  const {error}=await sb.from(table).delete().neq('id','__never_matches__');
  if(error) throw error;
}
async function importData(){
  if(!isAdmin()){ toast('Connecte-toi pour modifier les données','error'); return; }
  const input=document.getElementById('importFileInput');
  if(!input || !input.files || !input.files[0]){ toast('Choisis un fichier JSON','error'); return; }
  if(!confirm('Importer ce fichier va REMPLACER toutes les données actuelles pour tout le monde. Continuer ?')) return;
  try{
    const text=await input.files[0].text();
    const data=JSON.parse(text);
    if(!data.players || !data.fives) throw new Error('Fichier invalide');
    await deleteAllRows('goals');
    await deleteAllRows('participations');
    await deleteAllRows('fives');
    await deleteAllRows('players');
    for(const p of data.players) await PlayersRepo.save(p);
    for(const f of data.fives) await FivesRepo.save(f);
    for(const part of (data.participations||[])) await ParticipationsRepo.save(part);
    for(const g of (data.goals||[])) await GoalsRepo.save(g);
    await loadAll();
    toast('Import réussi','success');
    render();
  }catch(e){
    console.error(e);
    toast('Erreur lors de l\'import : '+e.message,'error');
  }
}

async function init(){
  document.getElementById('view').innerHTML=`<div class="empty-state"><div class="e-icon">⚽</div><div style="font-weight:700;">Chargement de LeFiveyyy...</div></div>`;
  try{
    await initAuth();
    await loadAll();
  }catch(err){
    console.error(err);
    document.getElementById('view').innerHTML=`<div class="empty-state"><div class="e-icon">⚠️</div><div style="font-weight:700;">Connexion à la base impossible</div><div class="page-sub" style="margin-top:6px;">${esc(err.message)}<br>Vérifie ta connexion internet et réessaie.</div></div>`;
    return;
  }
  window.addEventListener('hashchange', render);
  document.getElementById('burgerBtn').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.add('show');
    document.getElementById('sidebarBackdrop').classList.add('show');
  });
  function closeSidebar(){
    document.getElementById('sidebar').classList.remove('show');
    document.getElementById('sidebarBackdrop').classList.remove('show');
  }
  document.getElementById('sidebarClose').addEventListener('click',closeSidebar);
  document.getElementById('sidebarBackdrop').addEventListener('click',closeSidebar);
  document.getElementById('navMobile').addEventListener('click',closeSidebar);
  render();
}
init();
